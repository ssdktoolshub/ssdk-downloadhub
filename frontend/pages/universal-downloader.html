<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Downloader - SSDK DownloadHub</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/base.css">
</head>
<body>
        <header class="site-header" style="background: white; padding: 15px 0; border-bottom: 1px solid #E2E8F0; position: sticky; top: 0; z-index: 100; margin-bottom: 30px;">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="../index.html" class="logo" style="font-size: 1.5rem; font-weight: 800; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 8px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                SSDK DownloadHub
            </a>
        </div>
    </header>
    <main class="container">
        <h1 style="font-size: 2.2rem; font-weight: 800; text-align: center; color: #0F172A; margin-bottom: 30px;">Universal Downloader</h1>
        <div class="url-input-group" style="margin-bottom: 40px; display: flex; gap: 10px; max-width: 800px; margin-left: auto; margin-right: auto; background: white; padding: 10px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #E2E8F0;">
            <input type="url" id="url-input" placeholder="Paste your video, audio or media URL..." style="flex: 1; padding: 15px; border: none; font-size: 1.1rem; outline: none; background: transparent;" autofocus>
            <button id="analyze-btn" style="padding: 15px 30px; font-size: 1.1rem; border-radius: 8px; background: var(--primary); color: white; border: none; font-weight: 700; cursor: pointer; transition: transform 0.2s;">Analyze</button>
        </div>
        <div id="result-container"></div>
    </main>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/trimming.js"></script>
    <script src="../js/downloader.js"></script>
    <script src="../js/analyzer.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
