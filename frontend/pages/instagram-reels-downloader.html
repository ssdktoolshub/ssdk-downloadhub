<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSTAGRAM REELS Downloader - SSDK DownloadHub</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/base.css">
</head>
<body>
        <header class="site-header" style="background: white; padding: 15px 0; border-bottom: 1px solid #E2E8F0; position: sticky; top: 0; z-index: 100; margin-bottom: 30px;">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="../index.html" class="logo" style="font-size: 1.5rem; font-weight: 800; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 8px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                SSDK DownloadHub
            </a>
        </div>
    </header>
    <main class="container">
        <h1 style="font-size: 2.2rem; font-weight: 800; text-align: center; color: #0F172A; margin-bottom: 30px;">INSTAGRAM REELS Downloader</h1>
                <div class="url-input-group" style="margin-bottom: 40px; display: flex; flex-wrap: wrap; gap: 10px; max-width: 800px; margin-left: auto; margin-right: auto; background: white; padding: 10px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.06); border: 1px solid #E2E8F0; align-items: center;">
            <button onclick="navigator.clipboard.readText().then(t => document.getElementById('url-input').value = t).catch(()=>alert('Please allow clipboard permissions or paste manually.'))" style="padding: 12px; background: #F1F5F9; border: none; border-radius: 10px; cursor: pointer; color: var(--primary); display: flex; align-items: center; justify-content: center; transition: all 0.2s;" title="Paste from clipboard">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
            </button>
            <input type="url" id="url-input" placeholder="Paste your INSTAGRAM REELS URL here..." style="flex: 1; min-width: 200px; padding: 12px 10px; border: none; font-size: 1.1rem; outline: none; background: transparent; color: #0F172A;" autofocus>
            <button id="analyze-btn" style="padding: 14px 28px; font-size: 1.1rem; border-radius: 10px; background: linear-gradient(135deg, var(--primary), #7C3AED); color: white; border: none; font-weight: 700; cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3); flex-grow: 1; max-width: 200px;">Analyze</button>
        </div>
        <div id="result-container"></div>
    </main>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/trimming.js"></script>
    <script src="../js/downloader.js"></script>
    <script src="../js/analyzer.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
